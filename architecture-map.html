<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Smart Assess Ja — Architecture Map</title>
<style>
  :root {
    --bg: #0F0F0F; --panel: #161616; --panel-2: #1c1c1c; --border: #2a2a2a;
    --text: #e8e8e8; --muted: #8a8a8a;
    --client: #4ea1ff; --route: #7bd389; --service: #c792ea; --db: #ffb86b;
    --external: #ff6b9d; --critical: #ff3860; --accent: #f5b942; --accent-2: #ff7a45;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; overflow: hidden; }
  #app { display: flex; height: 100%; }
  #canvas-wrap { flex: 1; position: relative; overflow: hidden; background: radial-gradient(circle at 20% 20%, #141414 0%, #0a0a0a 100%); }
  #topbar { position: absolute; top: 0; left: 0; right: 0; z-index: 10; display: flex; align-items: center; gap: 8px; padding: 12px 16px; background: linear-gradient(180deg, rgba(15,15,15,0.95), rgba(15,15,15,0.0)); flex-wrap: wrap; }
  .title { font-weight: 700; font-size: 14px; margin-right: 12px; color: var(--text); }
  .chip { font-size: 12px; padding: 6px 12px; border-radius: 100px; border: 1px solid var(--border); background: var(--panel); color: var(--muted); cursor: pointer; user-select: none; transition: all .15s; }
  .chip:hover { border-color: var(--accent); color: var(--text); }
  .chip.active { background: var(--accent); color: #1a1200; border-color: var(--accent); font-weight: 700; }
  #zoom-controls { position: absolute; bottom: 16px; left: 16px; z-index: 10; display: flex; gap: 6px; }
  #zoom-controls button { width: 30px; height: 30px; border-radius: 6px; border: 1px solid var(--border); background: var(--panel); color: var(--text); cursor: pointer; font-size: 15px; }
  #zoom-controls button:hover { border-color: var(--accent); }
  svg { width: 100%; height: 100%; cursor: grab; }
  svg.panning { cursor: grabbing; }
  .cluster-box { fill-opacity: 0.06; stroke-opacity: 0.35; }
  .cluster-label { font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; fill: var(--muted); }
  .node-rect { stroke-width: 1.4; cursor: pointer; transition: opacity .15s; }
  .node-rect.critical { stroke-width: 2.2; }
  .node-rect.dead { stroke-dasharray: 4 3; }
  .node-label { font-size: 12.5px; font-weight: 700; fill: var(--text); pointer-events: none; }
  .node-sub { font-size: 10.5px; fill: var(--muted); pointer-events: none; }
  .node-sub.dead { fill: var(--critical); font-weight: 700; }
  .node-group { transition: opacity .15s; }
  .node-group.dimmed { opacity: 0.15; }
  .edge-path { fill: none; transition: opacity .15s, stroke-width .15s; }
  .edge-path.dimmed { opacity: 0.06; }
  .edge-path.highlighted { stroke-width: 3; }
  .edge-label { font-size: 9.5px; fill: var(--muted); pointer-events: none; transition: opacity .15s; }
  .edge-label.dimmed { opacity: 0.08; }
  .badge { font-size: 9px; font-weight: 800; fill: #fff; }
  #sidebar { width: 380px; background: var(--panel); border-left: 1px solid var(--border); overflow-y: auto; padding: 20px; flex: none; }
  #sidebar h2 { font-size: 16px; margin: 0 0 4px; }
  #sidebar .path { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--accent); word-break: break-all; margin-bottom: 14px; }
  #sidebar .role { font-size: 13px; color: var(--text); margin-bottom: 10px; line-height: 1.5; }
  #sidebar .plain-box { background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 14px; font-size: 13px; line-height: 1.6; color: var(--text); }
  #sidebar .plain-box .lbl { font-size: 10px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--muted); font-weight: 700; margin-bottom: 6px; }
  #sidebar ul { margin: 0 0 14px; padding-left: 18px; font-size: 12.5px; color: var(--muted); line-height: 1.7; }
  #sidebar .section-lbl { font-size: 10px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--muted); font-weight: 700; margin: 16px 0 8px; border-top: 1px solid var(--border); padding-top: 14px; }
  #sidebar .edge-row { font-size: 12px; padding: 5px 0; color: var(--text); }
  #sidebar .edge-row .k { color: var(--muted); }
  .sev-high { color: var(--critical); } .sev-med { color: var(--accent-2); } .sev-low { color: var(--accent); }
  #sidebar .finding { font-size: 12.5px; margin-bottom: 10px; padding-left: 14px; border-left: 2px solid var(--accent); line-height: 1.5; }
  .legend-row { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--muted); margin-bottom: 6px; }
  .legend-dot { width: 10px; height: 10px; border-radius: 3px; flex: none; }
</style>
</head>
<body>
<div id="app">
  <div id="canvas-wrap">
    <div id="topbar">
      <span class="title">Smart Assess Ja — Architecture</span>
      <div class="chip active" data-filter="overview">Overview</div>

    <svg id="svg" viewBox="0 0 1620 1000">
      <defs>
        <marker id="arrow-normal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5a5a5a"/></marker>
        <marker id="arrow-critical" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff3860"/></marker>
        <marker id="arrow-api" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff7a45"/></marker>
        <marker id="arrow-db" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffb86b"/></marker>
        <marker id="arrow-mount" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4ea1ff"/></marker>

  </div>

</div>

<script>
const clusters = [
  { id: 'client',   label: 'Client (React / App Router pages)', x: 30,   y: 60, w: 240, h: 900, color: '#4ea1ff' },
  { id: 'entry',    label: 'Server entry',                      x: 300,  y: 60, w: 180, h: 320, color: '#4ea1ff' },
  { id: 'routes',   label: 'API routes',                        x: 510,  y: 60, w: 260, h: 900, color: '#7bd389' },
  { id: 'services', label: 'Services (src/lib)',                 x: 800,  y: 60, w: 220, h: 900, color: '#c792ea' },
  { id: 'data',     label: 'Data (Postgres, per school)',        x: 1050, y: 60, w: 220, h: 900, color: '#ffb86b' },
  { id: 'external', label: 'External services',                  x: 1300, y: 60, w: 290, h: 620, color: '#ff6b9d' },
];

const N = (id, cluster, label, sub, x, y, w, h, color, opts = {}) => ({
  id, cluster, label, sub, x, y, w, h, color, ...opts
});

const nodes = [
  // ---------------- CLIENT ----------------
  N('home-page', 'client', 'page.tsx', 'homepage', 50, 100, 200, 56, 'client', {
    role: 'Marketing homepage: hero, features, how-it-works, contact form.',
    plain: 'The first page a visitor sees. Explains what Smart Assess Ja does and has a contact form and demo request buttons.',
    path: 'src/app/page.tsx',
    notes: ['Renders NavBar + ChatWidget globally via layout', 'Contact form posts to a lead-capture route', 'Stat strip: "9 exam formats, 6 role-based portals, 0 paper needed"'],
    tag: ['overview', 'leads', 'all'],
  }),
  N('take-exam-page', 'client', 'take/page.tsx', 'student exam-taking screen', 50, 176, 200, 64, 'client', {
    critical: true,
    role: 'Renders exam questions, times the session, and writes answers directly to Postgres via the Supabase client (no API-route layer in between).',
    plain: 'This is the actual screen a student sees while sitting an exam — the questions, the timer, and the "your answers are being saved" logic all live here.',
    path: 'src/app/student/exam/[id]/take/page.tsx',
    notes: ['Line 349: supabase.from(\'responses\').upsert() writes answers straight from the client', 'Line 364/386: exam_sessions.update() flags tab-switch violations', 'Options are shuffled with a seeded PRNG (mulberry32, lines 13-31) so shuffle order is stable per session but different per student', 'Falls back to local IndexedDB via examOfflineStore when offline'],
    tag: ['overview', 'critical', 'auth', 'all'],
  }),
  N('demo-exam', 'client', 'DemoExam.tsx', 'public + OCBN demo component', 50, 252, 200, 56, 'client', {
    role: 'Reusable prop-driven demo exam used by both the public /demo-exam page and the OCBN event page.',
    plain: 'A generalized, "try it yourself" version of the real exam experience, used both for general marketing and for the one-off OCBN networking-event demo.',
    path: 'src/components/DemoExam.tsx',
    notes: ['leaderboardEnabled prop gates the OCBN-only leaderboard + ice-break effect', 'Never touches real school data — entirely self-contained'],
    tag: ['overview', 'leads', 'all'],
  }),
  N('chat-widget', 'client', 'ChatWidget.tsx', 'AI help bubble', 50, 328, 200, 56, 'client', {
    role: 'Global floating "?" chat widget rendered on every public and logged-in page except live exam-taking routes.',
    plain: 'The little question-mark chat bubble in the corner of the screen that visitors and logged-in users can ask questions to.',
    path: 'src/components/ChatWidget.tsx',
    notes: ['EXAM_ROUTE_PATTERNS regex explicitly excludes exam-taking routes — a real integrity decision, not an oversight', 'Posts to /api/chat with an optional accessToken'],
    tag: ['overview', 'ai', 'all'],
  }),
  N('waitlist-form', 'client', 'WaitlistForm.tsx', '+ InvestorForm.tsx', 50, 404, 200, 56, 'client', {
    role: 'Lead-capture forms on the coming-soon page for prospective schools and investors.',
    plain: 'The signup boxes on the "coming soon" page that let a school or an investor leave their email to be contacted.',
    path: 'src/components/WaitlistForm.tsx',
    notes: ['No separate marketing-consent checkbox — one submit = both a confirmation email and inclusion in the list', 'Honeypot field + Cloudflare Turnstile guard both forms'],
    tag: ['overview', 'leads', 'all'],
  }),
  N('lesson-plans-page', 'client', 'lesson-plans/page.tsx', 'teacher lesson plan builder', 50, 480, 200, 64, 'client', {
    role: 'Teacher-facing lesson-plan builder with My Plans / Browse Library tabs.',
    plain: 'Where a teacher writes their own lesson plans, gets AI help drafting one, and can browse or copy plans other schools have shared.',
    path: 'src/app/teacher/lesson-plans/page.tsx',
    notes: ['Gated behind school_settings.enabled_features.lessonPlanLibraryEnabled', '"Browse Library" reads from a completely different Supabase project than "My Plans"'],
    tag: ['overview', 'lessonlib', 'all'],
  }),
  N('nav-bar', 'client', 'NavBar.tsx', 'global site chrome', 50, 556, 200, 48, 'client', {
    role: 'Global navigation bar rendered by the root layout on every route not in its shouldHide exclusion list.',
    plain: 'The header/menu bar that appears at the top of most pages.',
    path: 'src/components/NavBar.tsx',
    notes: ['Fixed this session: was showing "Portal / Log out" to signed-out visitors on any unlisted route', 'Maintains its own path-exclusion list — a recurring source of bugs when new routes are added'],
    tag: ['overview', 'all'],
  }),
  N('build-my-school', 'client', 'build-my-school/page.tsx', '4-step request wizard', 50, 620, 200, 56, 'client', {
    role: 'Multi-step form where a prospective school requests onboarding.',
    plain: 'The "sign my school up" form — asks about workflow style, features wanted, then submits for the founder to review.',
    path: 'src/app/build-my-school/page.tsx',
    notes: ['4 steps: school info -> workflow -> features -> review', 'No live-content copy issues found in this session\'s pass'],
    tag: ['overview', 'leads', 'all'],
  }),

  // ---------------- ENTRY ----------------
  N('proxy-middleware', 'entry', 'proxy.ts', 'Next.js middleware', 320, 100, 140, 64, 'client', {
    critical: true,
    role: 'Runs before every request: maintenance-mode gate, coming-soon domain gate, pitch subdomain rewrite, and /dashboard auth check.',
    plain: 'A gatekeeper that runs before almost every page loads — decides whether to show the coming-soon page, redirect to a demo subdomain, or check that you\'re logged in.',
    path: 'src/proxy.ts',
    notes: ['Line 8: COMING_SOON_HOSTS gates the real domain, not the *.vercel.app URLs', 'Line 12: PITCH_HOST rewrites pitch.smartassessja.com -> /pitch/schools.html', 'Line 63-67: only /dashboard is actually auth-checked here; every portal route\'s auth lives in its own page instead'],
    tag: ['overview', 'critical', 'auth', 'all'],
  }),
  N('root-layout', 'entry', 'layout.tsx', 'root App Router layout', 320, 200, 140, 56, 'client', {
    role: 'Wraps every page: injects NavBar, ChatWidget, and Sentry instrumentation globally.',
    plain: 'The outer shell every single page is rendered inside of.',
    path: 'src/app/layout.tsx',
    notes: ['Global mount point for NavBar + ChatWidget (see their own per-route exclusion lists)'],
    tag: ['overview', 'all'],
  }),

  // ---------------- ROUTES (API) ----------------
  N('api-chat', 'routes', 'api/chat/route.ts', 'POST', 530, 100, 220, 56, 'route', {
    role: 'Builds a system prompt from a hand-maintained facts block and proxies to Claude Haiku for the help-widget chat.',
    plain: 'The backend behind the chat bubble — takes your question, adds context about what the platform can do, and asks the AI to answer.',
    path: 'src/app/api/chat/route.ts',
    notes: ['Line 155: model is claude-haiku-4-5-20251001, not Sonnet', 'Line 53-69: system prompt explicitly forbids inventing prices/features and forbids account-specific answers', 'Line 96: rate-limited 20/min per user-or-IP', 'Untrusted visitor input wrapped in <visitor_message> tags (line 144) as prompt-injection defense'],
    tag: ['overview', 'critical', 'ai', 'all'],
  }),
  N('api-lesson-generate', 'routes', 'lesson-plans/generate', 'POST', 530, 176, 220, 56, 'route', {
    role: 'AI-drafts the 5E body of a lesson plan (Engage/Explore/Explain/Elaborate/Evaluate) from a subject/grade/topic.',
    plain: 'The "help me draft this" button on the lesson-plan builder — sends your topic to the AI and gets back a full lesson-plan draft.',
    path: 'src/app/api/lesson-plans/generate/route.ts',
    notes: ['MONTHLY_LIMIT = 15 per teacher (line 7), tracked via ai_polish_usage table', 'model: claude-sonnet-4-6 (different model than the chat widget)'],
    tag: ['overview', 'ai', 'lessonlib', 'all'],
  }),
  N('api-lesson-library', 'routes', 'lesson-plans/library', 'GET', 530, 252, 220, 56, 'route', {
    role: 'Browses the shared cross-school lesson-plan library, verifying the caller against their own school\'s auth before querying a different, central Supabase project.',
    plain: 'Powers "Browse Library" — checks you\'re a real logged-in teacher at your own school, then goes and fetches lesson plans other schools have shared.',
    path: 'src/app/api/lesson-plans/library/route.ts',
    notes: ['Two-project auth pattern: identity checked against the caller\'s own school DB, data read from a separate central DB', 'Fails gracefully (503, "not connected yet") if LIBRARY_SUPABASE_URL isn\'t set for that school'],
    tag: ['lessonlib', 'critical', 'all'],
  }),
  N('api-lesson-publish', 'routes', 'lesson-plans/library/publish', 'POST', 530, 328, 220, 56, 'route', {
    role: 'Copies one lesson plan into the central shared_lesson_plans table, attributed by a school-name env var.',
    plain: 'The "Publish to Library" button — takes a copy of your lesson plan and makes it visible to every other school.',
    path: 'src/app/api/lesson-plans/library/publish/route.ts',
    notes: ['One-way copy, not a live link — editing the original afterward does not update the published copy', 'Attribution comes from NEXT_PUBLIC_SCHOOL_NAME, a per-deployment env var, not a database field'],
    tag: ['lessonlib', 'all'],
  }),
  N('api-ocbn-leaderboard', 'routes', 'ocbn-demo/leaderboard', 'GET + POST', 530, 404, 220, 56, 'route', {
    role: 'Reads/writes the live OCBN demo-exam leaderboard in the central project.',
    plain: 'Powers the live scoreboard on the OCBN demo quiz — saves your score and fetches the current top 10.',
    path: 'src/app/api/ocbn-demo/leaderboard/route.ts',
    notes: ['RLS on this table is public select/insert by design — it\'s meant to be shown to anyone taking the demo', 'Rate limit is deliberately generous (60/hr) since many attendees share one venue Wi-Fi IP'],
    tag: ['leads', 'all'],
  }),
  N('api-waitlist-submit', 'routes', 'waitlist/submit', 'POST', 530, 480, 220, 56, 'route', {
    role: 'Validates and inserts a coming-soon-page waitlist signup, then sends two emails via Resend.',
    plain: 'What actually happens when someone submits the "notify me" form on the coming-soon page.',
    path: 'src/app/api/waitlist/submit/route.ts',
    notes: ['Honeypot + Turnstile + 5/hr rate limit', 'Unique index on lower(email) — a duplicate signup is treated as success, not an error'],
    tag: ['leads', 'all'],
  }),
  N('api-school-features', 'routes', 'school-features/configure', 'POST', 530, 556, 220, 56, 'route', {
    role: 'Owner-only route that opens a direct Postgres connection to a specific school\'s database (from a pasted connection string) to toggle its feature flags.',
    plain: 'How the founder turns features like the Lesson Plan Library on or off for one specific school, without storing that school\'s database password anywhere.',
    path: 'src/app/api/school-features/configure/route.ts',
    notes: ['The connection string is used once and never persisted — by design, per its own comment', 'Requires verifySystemAdmin() — see services cluster'],
    tag: ['auth', 'all'],
  }),
  N('api-stripe-checkout', 'routes', 'stripe-checkout', 'POST', 530, 632, 220, 56, 'route', {
    role: 'Would create a Stripe Checkout session, but returns 503 whenever STRIPE_SECRET_KEY is unset.',
    plain: 'The route that would handle card payments — currently disabled, telling anyone who hits it to use bank transfer instead.',
    path: 'src/app/api/stripe-checkout/route.ts',
    notes: ['Line 27: hard-gated off — "Card payments are not available yet. Use bank transfer instead."', 'Billing is explicitly paused platform-wide right now, not just this route'],
    tag: ['auth', 'all'],
  }),
  N('api-school-requests', 'routes', 'school-requests/submit', 'POST', 530, 708, 220, 56, 'route', {
    role: 'Handles a "Build My School" submission: validates, inserts, drafts an AI review summary for staff.',
    plain: 'What happens behind the scenes when a school finishes the "sign us up" wizard.',
    path: 'src/app/api/school-requests/submit/route.ts',
    notes: ['Also triggers an internal staff-notification email'],
    tag: ['leads', 'ai', 'all'],
  }),
  N('direct-db-write', 'routes', '(no route — direct write)', 'client → Postgres, RLS-enforced', 530, 784, 220, 64, 'route', {
    critical: true,
    role: 'The exam-taking flow has no API-route layer at all: the browser\'s Supabase client writes straight to responses/exam_sessions, with row-level security as the only access-control boundary.',
    plain: 'Unlike almost everything else on this map, saving exam answers doesn\'t go through a server-side checkpoint — the student\'s browser talks directly to the database, and the database itself is what decides what they\'re allowed to touch.',
    path: 'src/app/student/exam/[id]/take/page.tsx:349,364,386,503,505',
    notes: ['This is a deliberate architectural choice (lower latency for autosave), not an oversight, but it does mean RLS policies on responses/exam_sessions are the entire access-control story here', 'A documented cross-tenant isolation regression test exists to guard this — see access-control matrix doc'],
    tag: ['overview', 'critical', 'auth', 'all'],
  }),

  // ---------------- SERVICES ----------------
  N('lib-ratelimit', 'services', 'rateLimit.ts', '48 lines', 820, 100, 180, 48, 'service', {
    role: 'Fixed-window IP/user rate limiter backed by a check_rate_limit() Postgres function; fails open on error.',
    plain: 'A shared helper every public form and API route uses to stop the same person from submitting too many times too fast.',
    path: 'src/lib/rateLimit.ts',

  N('lib-validatebody', 'services', 'validateBody.ts', '25 lines', 820, 168, 180, 48, 'service', {
    role: 'Parses and zod-validates a request body, used by nearly every API route in the codebase.',

    path: 'src/lib/validateBody.ts',
    notes: ['Schemas are expected to use .strict() so unknown fields are rejected, not silently dropped'],
    tag: ['overview', 'auth', 'all'],
  }),
  N('lib-verifysystemadmin', 'services', 'verifySystemAdmin.ts', '24 lines', 820, 236, 180, 48, 'service', {
    role: 'Re-derives caller identity from their own access token, then checks profiles.is_system_admin server-side.',

  N('lib-librarydb', 'services', 'libraryDb.ts', '20 lines', 820, 372, 180, 48, 'service', {

  }),
  N('lib-supabase', 'services', 'supabase.ts', 'browser client', 820, 508, 180, 48, 'service', {
    role: 'The single browser-side Supabase client instance imported across nearly every client component.',

    path: 'src/lib/supabase.ts',
    notes: ['Uses the publishable (anon) key — safe to ship to the browser; RLS is what actually restricts it'],
    tag: ['overview', 'auth', 'all'],
  }),
  N('lib-offlinestore', 'services', 'examOfflineStore.ts', '104 lines', 820, 576, 180, 56, 'service', {
    critical: true,
    role: 'IndexedDB-backed local cache (via idb) for exam answers, violation queue, and pending-submit state during connectivity loss.',

<script>
const svg = document.getElementById('svg');
const viewport = document.getElementById('viewport');
const sidebar = document.getElementById('sidebar');

const CLUSTER_COLORS = { client: '#4ea1ff', route: '#7bd389', service: '#c792ea', db: '#ffb86b', external: '#ff6b9d' };

let selectedId = null;
let currentFilter = 'overview';
let tx = 0, ty = 0, scale = 0.62;
let isPanning = false, panStartX = 0, panStartY = 0, panStartTx = 0, panStartTy = 0;

function nodeById(id) { return nodes.find(n => n.id === id); }
function centerRight(n) { return { x: n.x + n.w, y: n.y + n.h / 2 }; }
function centerLeft(n) { return { x: n.x, y: n.y + n.h / 2 }; }

function edgeColor(kind) {
  return kind === 'critical' ? '#ff3860' : kind === 'api' ? '#ff7a45' : kind === 'db' ? '#ffb86b' : kind === 'mount' ? '#4ea1ff' : '#5a5a5a';
}

function buildPath(a, b) {
  const p1 = centerRight(a), p2 = centerLeft(b);
  const dx = Math.max(60, (p2.x - p1.x) / 2);
  return `M ${p1.x} ${p1.y} C ${p1.x + dx} ${p1.y}, ${p2.x - dx} ${p2.y}, ${p2.x} ${p2.y}`;
}

function render() {
  viewport.innerHTML = '';

  clusters.forEach(c => {
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.innerHTML = `
      <rect class="cluster-box" x="${c.x}" y="${c.y}" width="${c.w}" height="${c.h}" rx="10" fill="${c.color}" stroke="${c.color}"></rect>
      <text class="cluster-label" x="${c.x + 12}" y="${c.y - 12}">${c.label}</text>
    `;
    viewport.appendChild(g);
  });

  const edgeEls = [];
  edges.forEach((e, i) => {
    const a = nodeById(e.from), b = nodeById(e.to);
    if (!a || !b) return;
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('class', 'edge-path');
    path.setAttribute('d', buildPath(a, b));
    path.setAttribute('stroke', edgeColor(e.kind));
    path.setAttribute('stroke-width', e.kind === 'critical' ? 2.4 : 1.4);
    path.setAttribute('marker-end', `url(#arrow-${e.kind})`);
    path.dataset.from = e.from; path.dataset.to = e.to; path.dataset.tag = e.tag.join(',');
    viewport.appendChild(path);
    edgeEls.push(path);

    const mid = pathMidpoint(a, b);
    const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    label.setAttribute('class', 'edge-label');
    label.setAttribute('x', mid.x);
    label.setAttribute('y', mid.y - 4 + (i % 3) * 10);
    label.setAttribute('text-anchor', 'middle');
    label.dataset.tag = e.tag.join(',');
    label.textContent = e.label;
    viewport.appendChild(label);
  });

  nodes.forEach(n => {
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('class', 'node-group');
    g.dataset.id = n.id;
    g.dataset.tag = (n.tag || []).join(',');

    const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    rect.setAttribute('class', 'node-rect' + (n.critical ? ' critical' : '') + (n.deadCode ? ' dead' : ''));
    rect.setAttribute('x', n.x); rect.setAttribute('y', n.y);
    rect.setAttribute('width', n.w); rect.setAttribute('height', n.h);
    rect.setAttribute('rx', 8);
    rect.setAttribute('fill', '#161616');
    rect.setAttribute('stroke', CLUSTER_COLORS[n.color] || '#888');
    g.appendChild(rect);

    const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    label.setAttribute('class', 'node-label');
    label.setAttribute('x', n.x + 10); label.setAttribute('y', n.y + 20);
    label.textContent = n.label;
    g.appendChild(label);

    const sub = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    sub.setAttribute('class', 'node-sub' + (n.deadCode ? ' dead' : ''));
    sub.setAttribute('x', n.x + 10); sub.setAttribute('y', n.y + 36);
    sub.textContent = n.sub;
    g.appendChild(sub);

    const fixCount = (FIXES[n.id] || []).length;
    const bugCount = (KNOWN_BUGS[n.id] || []).length;
    if (fixCount) g.appendChild(badge(n.x + n.w - 34, n.y + 10, '#3ecf8e', fixCount));
    if (bugCount) g.appendChild(badge(n.x + n.w - 14, n.y + 10, '#ff3860', bugCount));

    g.addEventListener('mouseenter', () => { if (!selectedId) applyHover(n.id); });
    g.addEventListener('mouseleave', () => { if (!selectedId) applyHover(null); });
    g.addEventListener('click', (ev) => { ev.stopPropagation(); selectedId = n.id; applyHover(n.id); showSidebar(n.id); });

    viewport.appendChild(g);
  });

  applyFilter(currentFilter);
  showDefaultSidebar();
}

function badge(x, y, color, count) {
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  c.setAttribute('cx', x); c.setAttribute('cy', y); c.setAttribute('r', 9); c.setAttribute('fill', color);
  const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  t.setAttribute('class', 'badge'); t.setAttribute('x', x); t.setAttribute('y', y + 3); t.setAttribute('text-anchor', 'middle');
  t.textContent = count;
  g.appendChild(c); g.appendChild(t);
  return g;
}

function pathMidpoint(a, b) {
  const p1 = centerRight(a), p2 = centerLeft(b);
  return { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 };
}

function applyHover(id) {
  const groups = viewport.querySelectorAll('.node-group');
  const edgePaths = viewport.querySelectorAll('.edge-path');
  const edgeLabels = viewport.querySelectorAll('.edge-label');
  if (!id) {
    groups.forEach(g => g.classList.remove('dimmed'));
    edgePaths.forEach(p => { p.classList.remove('dimmed'); p.classList.remove('highlighted'); });
    edgeLabels.forEach(l => l.classList.remove('dimmed'));
    applyFilter(currentFilter);
    return;
  }
  const connected = new Set([id]);
  edges.forEach(e => { if (e.from === id) connected.add(e.to); if (e.to === id) connected.add(e.from); });
  groups.forEach(g => g.classList.toggle('dimmed', !connected.has(g.dataset.id)));
  edgePaths.forEach(p => {
    const relevant = p.dataset.from === id || p.dataset.to === id;
    p.classList.toggle('dimmed', !relevant);
    p.classList.toggle('highlighted', relevant);
  });
  edgeLabels.forEach((l, i) => {
    const e = edges[i];
    l.classList.toggle('dimmed', !(e.from === id || e.to === id));
  });
}

function applyFilter(filter) {
  currentFilter = filter;
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.dataset.filter === filter));
  if (selectedId) return;
  const groups = viewport.querySelectorAll('.node-group');
  const edgePaths = viewport.querySelectorAll('.edge-path');
  const edgeLabels = viewport.querySelectorAll('.edge-label');
  groups.forEach(g => {
    const tags = g.dataset.tag.split(',');
    g.classList.toggle('dimmed', !tags.includes(filter));
  });
  edgePaths.forEach(p => {
    const tags = (p.dataset.tag || '').split(',');
    p.classList.toggle('dimmed', !tags.includes(filter));
  });
  edgeLabels.forEach((l) => {
    const tags = (l.dataset.tag || '').split(',');
    l.classList.toggle('dimmed', !tags.includes(filter));
  });
}

function showSidebar(id) {
  const n = nodeById(id);
  if (!n) return;
  const incoming = edges.filter(e => e.to === id);
  const outgoing = edges.filter(e => e.from === id);
  const fixes = FIXES[id] || [];
  const bugs = KNOWN_BUGS[id] || [];

  sidebar.innerHTML = `
    <h2>${n.label}</h2>
    <div class="path">${n.path || ''}</div>
    <div class="role">${n.role || ''}</div>
    <div class="plain-box"><div class="lbl">In plain English</div>${n.plain || ''}</div>
    ${n.notes && n.notes.length ? `<div class="section-lbl">Notes</div><ul>${n.notes.map(x => `<li>${x}</li>`).join('')}</ul>` : ''}
    ${outgoing.length ? `<div class="section-lbl">Outgoing (${outgoing.length})</div>${outgoing.map(e => `<div class="edge-row"><span class="k">→ ${nodeById(e.to)?.label || e.to}</span> — ${e.label}</div>`).join('')}` : ''}
    ${incoming.length ? `<div class="section-lbl">Incoming (${incoming.length})</div>${incoming.map(e => `<div class="edge-row"><span class="k">← ${nodeById(e.from)?.label || e.from}</span> — ${e.label}</div>`).join('')}` : ''}
    ${fixes.length ? `<div class="section-lbl">Fixes this session</div>${fixes.map(f => `<div class="edge-row">#${f.n} ${f.t}</div>`).join('')}` : ''}
    ${bugs.length ? `<div class="section-lbl">Known issues</div>${bugs.map(b => `<div class="edge-row sev-${b.sev === 'high' ? 'high' : b.sev === 'med' ? 'med' : 'low'}">[${b.sev.toUpperCase()}] ${b.t} <span class="k">(${b.ref})</span></div>`).join('')}` : ''}
  `;
}

function showDefaultSidebar() {
  sidebar.innerHTML = `
    <h2>Smart Assess Ja</h2>
    <div class="role">${nodes.length} nodes · ${edges.length} labeled edges. Click any node for detail, or use the filter chips above the canvas.</div>

    <div class="section-lbl">Notable findings from this map</div>
    <div class="finding"><b>Dead code, confirmed:</b> <code>initRageClickDetection()</code> in <code>rageClickDetector.ts:47</code> is exported but never called anywhere — yet the privacy policy explicitly promises rage-click detection is active. A real policy-vs-code mismatch, not just unused code.</div>
    <div class="finding"><b>No API layer on the critical path:</b> exam answers write directly from the browser to Postgres (<code>take/page.tsx:349</code>) with row-level security as the only checkpoint — everything else in the app goes through a server-side API route first.</div>
    <div class="finding"><b>Two different AI models in production:</b> the chat widget uses <code>claude-haiku-4-5-20251001</code>, lesson-plan drafting uses <code>claude-sonnet-4-6</code> — not documented anywhere as an intentional split, worth confirming it's deliberate.</div>
    <div class="finding"><b>Two-database split for one feature:</b> the Lesson Plan Library spans a school's own project (<code>lesson_plans</code>) and a separate central project (<code>shared_lesson_plans</code>) — easy to forget which table you're looking at.</div>
    <div class="finding"><b>Billing is fully wired but switched off:</b> Stripe integration exists in code (<code>stripe-checkout/route.ts</code>) but is hard-disabled without an API key — not a bug, but worth knowing before assuming payments work.</div>

    <div class="section-lbl">Legend</div>
    <div class="legend-row"><span class="legend-dot" style="background:#ff3860"></span> Critical path edge</div>
    <div class="legend-row"><span class="legend-dot" style="background:#ff7a45"></span> External API call</div>
    <div class="legend-row"><span class="legend-dot" style="background:#ffb86b"></span> Database read/write</div>
    <div class="legend-row"><span class="legend-dot" style="background:#4ea1ff"></span> Route mount</div>
    <div class="legend-row"><span class="legend-dot" style="background:#5a5a5a"></span> Normal call</div>
  `;
}

document.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', () => { selectedId = null; applyFilter(chip.dataset.filter); showDefaultSidebar(); });
});

svg.addEventListener('click', (e) => {
  if (e.target === svg) { selectedId = null; applyHover(null); showDefaultSidebar(); }
});

function updateTransform() { viewport.setAttribute('transform', `translate(${tx},${ty}) scale(${scale})`); }

svg.addEventListener('mousedown', (e) => {
  if (e.target.closest('.node-group')) return;
  isPanning = true; svg.classList.add('panning');
  panStartX = e.clientX; panStartY = e.clientY; panStartTx = tx; panStartTy = ty;
});
window.addEventListener('mousemove', (e) => {
  if (!isPanning) return;
  tx = panStartTx + (e.clientX - panStartX);
  ty = panStartTy + (e.clientY - panStartY);
  updateTransform();
});
window.addEventListener('mouseup', () => { isPanning = false; svg.classList.remove('panning'); });

svg.addEventListener('wheel', (e) => {
  e.preventDefault();
  const rect = svg.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const worldX = (mx - tx) / scale, worldY = (my - ty) / scale;
  const delta = e.deltaY > 0 ? 0.9 : 1.1;
  scale = Math.min(2.5, Math.max(0.25, scale * delta));
  tx = mx - worldX * scale; ty = my - worldY * scale;
  updateTransform();
}, { passive: false });

document.getElementById('zoom-in').addEventListener('click', () => { scale = Math.min(2.5, scale * 1.2); updateTransform(); });
document.getElementById('zoom-out').addEventListener('click', () => { scale = Math.max(0.25, scale * 0.8); updateTransform(); });
document.getElementById('zoom-fit').addEventListener('click', () => { tx = 20; ty = 10; scale = 0.62; updateTransform(); });

render();
updateTransform();
</script>
</body>
</html>
