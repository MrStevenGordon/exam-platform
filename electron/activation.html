<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Activate Smart Assess</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #FBF3EA; color: #1A0E06; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
  .card { background: white; border-radius: 12px; padding: 32px 28px; width: 360px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); }
  .brand { font-size: 11px; font-weight: 700; letter-spacing: 1.5px; color: #7A6A5A; text-transform: uppercase; margin-bottom: 4px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p.sub { font-size: 13px; color: #7A6A5A; margin: 0 0 20px; }
  label { font-size: 12px; font-weight: 700; color: #7A6A5A; letter-spacing: 0.5px; text-transform: uppercase; }
  input { width: 100%; box-sizing: border-box; margin-top: 6px; padding: 10px 12px; border: 1px solid #E5D9CB; border-radius: 6px; font-size: 15px; letter-spacing: 1px; text-transform: uppercase; }
  button { width: 100%; margin-top: 16px; padding: 12px 20px; background: #D4762A; color: white; border: none; border-radius: 6px; font-size: 14px; font-weight: 700; cursor: pointer; }
  button:disabled { opacity: 0.6; cursor: default; }
  .error { color: #C0392B; font-size: 13px; margin-top: 12px; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">Smart Assess Ja</div>
    <h1>Activate Smart Assess</h1>
    <p class="sub">Enter the license key emailed to your school or organization.</p>
    <label for="key">License key</label>
    <input id="key" type="text" placeholder="SA-XXXX-XXXX-XXXX" autofocus />
    <button id="submit">Activate</button>
    <div id="error" class="error"></div>
  </div>
  <script>
    const input = document.getElementById('key')
    const button = document.getElementById('submit')
    const errorEl = document.getElementById('error')

    async function activate() {
      const key = input.value.trim()
      if (!key) { errorEl.textContent = 'Enter your license key.'; return }
      button.disabled = true
      button.textContent = 'Activating…'
      errorEl.textContent = ''

      const result = await window.electronAPI.verifyLicense(key)
      if (!result.valid) {
        errorEl.textContent = result.error || 'Invalid license key.'
        button.disabled = false
        button.textContent = 'Activate'
      }
      // On success the main process itself navigates to the app — nothing more to do here.
    }

    button.addEventListener('click', activate)
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') activate() })
  </script>
</body>
</html>
