<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You are offline</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #FDF8F3; color: #1A1008; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 24px; }
  main { max-width: 440px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { font-size: 15px; line-height: 1.5; color: #5C4A3A; margin: 0 0 12px; }
  button { font: inherit; font-weight: 600; background: #D4762A; color: #fff; border: 0; border-radius: 8px; padding: 10px 18px; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1>You are offline</h1>
  <p>This page was not saved on your device, and there is no connection right now.</p>
  <p>Connect to the internet and try again. Flashcard decks and lessons you have already opened are kept on your device: open Smart Learning from your home screen or browser and look for them there.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
